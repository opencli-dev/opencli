# yaml-language-server: $schema=../../schema/opencli.schema.json
$schema: ../../schema/opencli.schema.json

opencli: "1.0.0"

info:
  title: opencli
  binaryName: opencli
  version: "0.1.0"
  description: Work with OpenCLI specifications.
  longDescription: |
    OpenCLI validates OpenCLI specification documents and generates typed
    command scaffolding for supported language and framework pairings.

exitCodes:
  - code: 0
    label: OK
    description: The command completed successfully.
  - code: 1
    label: Error
    description: Validation failed or an operational error occurred.

commands:
  - name: validate
    operationId: validate
    description: Validate an OpenCLI specification against the OpenCLI schema.
    longDescription: |
      Validate reads an OpenCLI specification in JSON or YAML and checks it
      structurally against the embedded schema, then semantically for issues
      such as dangling references, argument ordering, and identifier collisions.

      Pass - or omit the path to read from stdin.
    arguments:
      - name: SPEC
        description: OpenCLI specification path, or - for stdin.
        placeholder: spec
        type: file
        required: false

  - name: generate
    description: Generate command scaffolding from an OpenCLI specification.
    longDescription: |
      Each language-framework generator has its own command and options. The
      specification is validated and converted to a shared IR before the
      selected generator runs.
    commands:
      - name: go-cobra
        operationId: generateGoCobra
        description: Generate Go command scaffolding using Cobra.
        longDescription: |
          Generate typed Go handlers, parameter structs, Cobra constructors,
          schema types, and a root command assembler.

          Pass - or omit the specification path to read from stdin.
        arguments:
          - name: SPEC
            description: OpenCLI specification path, or - for stdin.
            placeholder: spec
            type: file
            required: false
        flags:
          - name: output
            short: o
            description: Output directory for generated files.
            type: path
            required: true
          - name: package
            description: Go package name for generated files.
            default: cligen

      - name: rust-clap
        operationId: generateRustClap
        description: Generate Rust command scaffolding using Clap.
        longDescription: |
          Generate a typed Rust module using Clap's derive API, including nested
          subcommands, value enums, argument relationships, and schema types.

          Pass - or omit the specification path to read from stdin.
        arguments:
          - name: SPEC
            description: OpenCLI specification path, or - for stdin.
            placeholder: spec
            type: file
            required: false
        flags:
          - name: output
            short: o
            description: Output directory for generated files.
            type: path
            required: true
          - name: module
            description: Rust module and output filename without the .rs suffix.
            default: opencli_gen
